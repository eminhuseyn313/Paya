<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#9CA3AF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <circle cx="45" cy="110" r="16"/>
    <!-- torso, side lying -->
    <line x1="60" y1="115" x2="140" y2="130"/>
    <!-- bottom arm propped -->
    <line x1="65" y1="120" x2="55" y2="160"/>
    <!-- hip pivot -->
    <circle cx="140" cy="130" r="6" fill="#9CA3AF" stroke="none"/>
    <!-- bottom leg, knee bent 45, on floor -->
    <line x1="140" y1="130" x2="150" y2="175"/>
    <line x1="150" y1="175" x2="110" y2="190"/>
    <!-- top leg, knee lifted open like a clamshell -->
    <line x1="140" y1="130" x2="160" y2="165"/>
    <line x1="160" y1="165" x2="115" y2="170"/>
    <!-- floor -->
    <line x1="30" y1="200" x2="200" y2="200"/>
  </g>
</svg>
