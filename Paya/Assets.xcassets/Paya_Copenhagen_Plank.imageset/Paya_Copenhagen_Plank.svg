<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#9CA3AF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- bench for top leg -->
    <rect x="150" y="150" width="55" height="10" rx="4" fill="#9CA3AF" stroke="none"/>
    <!-- head -->
    <circle cx="45" cy="130" r="16"/>
    <!-- torso, straight line, hips lifted -->
    <line x1="60" y1="135" x2="150" y2="135"/>
    <!-- bottom arm propped on elbow -->
    <line x1="60" y1="135" x2="55" y2="175"/>
    <line x1="55" y1="175" x2="80" y2="180"/>
    <!-- bottom leg on floor -->
    <line x1="150" y1="135" x2="140" y2="200"/>
    <!-- top leg resting on bench -->
    <line x1="150" y1="135" x2="180" y2="150"/>
  </g>
</svg>
