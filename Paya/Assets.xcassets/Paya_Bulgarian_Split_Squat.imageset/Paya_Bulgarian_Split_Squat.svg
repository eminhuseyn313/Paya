<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#9CA3AF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- floor -->
    <line x1="20" y1="205" x2="220" y2="205"/>
    <!-- bench behind for rear foot -->
    <rect x="150" y="150" width="45" height="10" rx="4" fill="#9CA3AF" stroke="none"/>
    <!-- head -->
    <circle cx="105" cy="70" r="17"/>
    <!-- torso, upright -->
    <line x1="105" y1="87" x2="110" y2="145"/>
    <!-- front leg bent 90 -->
    <line x1="110" y1="145" x2="90" y2="175"/>
    <line x1="90" y1="175" x2="90" y2="205"/>
    <!-- rear leg up onto bench -->
    <line x1="110" y1="145" x2="150" y2="160"/>
    <line x1="150" y1="160" x2="172" y2="152"/>
    <!-- arms holding dumbbells at sides -->
    <line x1="105" y1="105" x2="80" y2="150"/>
    <line x1="105" y1="105" x2="130" y2="150"/>
    <circle cx="80" cy="158" r="8" fill="#9CA3AF" stroke="none"/>
    <circle cx="130" cy="158" r="8" fill="#9CA3AF" stroke="none"/>
  </g>
</svg>
