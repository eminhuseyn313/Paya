<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#9CA3AF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- incline bench -->
    <line x1="70" y1="205" x2="140" y2="120"/>
    <line x1="70" y1="205" x2="30" y2="205"/>
    <!-- head -->
    <circle cx="150" cy="100" r="16"/>
    <!-- torso prone on bench -->
    <line x1="140" y1="115" x2="90" y2="165"/>
    <!-- legs -->
    <line x1="90" y1="165" x2="70" y2="205"/>
    <line x1="90" y1="165" x2="105" y2="205"/>
    <!-- arm rowing: upper arm back, elbow bent, dumbbell near ribs -->
    <line x1="122" y1="140" x2="150" y2="150"/>
    <line x1="150" y1="150" x2="130" y2="170"/>
    <circle cx="130" cy="170" r="8" fill="#9CA3AF" stroke="none"/>
  </g>
</svg>
