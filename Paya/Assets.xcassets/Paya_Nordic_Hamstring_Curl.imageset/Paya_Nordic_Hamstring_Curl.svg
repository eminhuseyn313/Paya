<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#9CA3AF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- floor -->
    <line x1="30" y1="205" x2="210" y2="205"/>
    <!-- knee (pivot point) -->
    <circle cx="130" cy="180" r="6" fill="#9CA3AF" stroke="none"/>
    <!-- shin, kneeling -->
    <line x1="130" y1="180" x2="150" y2="205"/>
    <!-- ankle anchor mark -->
    <rect x="140" y="200" width="24" height="10" rx="4" fill="#9CA3AF" stroke="none"/>
    <!-- thigh to hip -->
    <line x1="130" y1="180" x2="118" y2="150"/>
    <!-- torso leaning back at an angle (mid-lower position) -->
    <line x1="118" y1="150" x2="70" y2="95"/>
    <!-- head -->
    <circle cx="58" cy="80" r="16"/>
    <!-- arms reaching forward for balance -->
    <line x1="105" y1="130" x2="60" y2="120"/>
  </g>
</svg>
